[project]
name = "{{ cookiecutter.project_name }}"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "{{ cookiecutter.author.split('<')[0].strip() }}"{% if '<' in cookiecutter.author %}, email = "{{ cookiecutter.author.split('<')[1].rstrip('>').strip() }}"{% endif %} }]
requires-python = ">={{ cookiecutter.python_version }}"
dependencies = [
    "pydantic>=2",
    "pydantic-settings>=2",
{%- if cookiecutter.install_sentry == "y" %}
    "sentry-sdk",
{%- endif %}
{%- if cookiecutter.install_loguru == "y" %}
    "loguru",
{%- endif %}
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.project_slug }}"]

[tool.ruff]
line-length = 88
target-version = "py{{ cookiecutter.python_version.replace('.', '') }}"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "T20"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "{{ cookiecutter.python_version }}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov={{ cookiecutter.project_slug }} --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true
